server {
    listen      8080;
    host        0.0.0.0;
    server_name localhost;

    client_max_body_size 10M;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        methods     GET;
        root        ./www/html;
        index       index.html;
        autoindex   off;
    }

    location /uploads {
        methods         GET POST DELETE;
        root            ./www/uploads;
        upload_store    ./www/uploads;
        autoindex       on;
    }

    location /cgi-bin {
        methods         GET POST;
        root            ./www/cgi-bin;
        cgi_extension   .py;
        cgi_path        /usr/bin/python3;
    }
}
